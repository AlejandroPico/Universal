name: Deploy Universal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Test and validate
        run: npm test && npm run validate
      - name: Restore scientific downloads
        uses: actions/cache@v4
        with:
          path: |
            public/data/science/cluster-members.json.gz
            public/data/science/natural-ephemerides.json.gz
          key: scientific-catalogs-v2-${{ github.run_id }}
          restore-keys: scientific-catalogs-v2-
      - name: Build
        run: npm run build
      - name: Check visible tools in Chrome
        run: node scripts/check-visible-tools.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
